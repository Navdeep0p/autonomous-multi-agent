<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous Multi-Agent Workspace</title>
  <!-- Markdown & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <style>
    :root {
      --bg-base: #0c0d12;
      --bg-surface: #14161f;
      --bg-surface-elevated: #1a1d29;
      --border-subtle: #242838;
      --border-strong: #363c52;
      --text-primary: #f0f2f7;
      --text-secondary: #8d95a8;
      --accent: #3d72fe;
      --accent-glow: rgba(61, 114, 254, 0.15);
      --font-main: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      --font-code: "JetBrains Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Left Control Sidebar */
    .sidebar {
      width: 290px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      flex-shrink: 0;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3d72fe, #745df9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .new-session-btn {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .new-session-btn:hover {
      border-color: var(--border-strong);
      background: #202433;
    }

    /* Thread History Section */
    .threads-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .section-heading {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .threads-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 4px;
    }
    .thread-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .thread-item:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }
    .thread-item.active {
      background: rgba(61, 114, 254, 0.12);
      border-color: rgba(61, 114, 254, 0.4);
      color: var(--text-primary);
      font-weight: 500;
    }
    .thread-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    .thread-del-btn {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 0.75rem;
    }
    .thread-item:hover .thread-del-btn {
      opacity: 1;
    }
    .thread-del-btn:hover {
      color: #f87171;
    }

    /* Pipeline Status List */
    .agent-pipeline-list {
      border-top: 1px solid var(--border-subtle);
      padding-top: 14px;
    }
    .pipeline-node {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 0.8rem;
      color: #b4bac9;
      border-radius: 6px;
      margin-bottom: 3px;
      transition: all 0.2s;
    }
    .node-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #393e50;
      transition: all 0.2s;
    }
    
    .pipeline-node.active {
      color: #f0f2f7;
      font-weight: 600;
      background: rgba(61, 114, 254, 0.08);
    }
    .pipeline-node.active .status-dot {
      background: #3d72fe !important;
      box-shadow: 0 0 8px #3d72fe;
    }

    /* Engine Model Tag Badges */
    .engine-tag {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-code);
      font-weight: 600;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }
    .engine-tag.ollama {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }
    .engine-tag.gemini {
      background: rgba(61, 114, 254, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(147, 197, 253, 0.4);
    }
    .engine-tag.chromadb {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(192, 132, 252, 0.4);
    }

    .sidebar-meta {
      border-top: 1px solid var(--border-subtle);
      padding-top: 10px;
      font-size: 0.72rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
    }

    /* Workspace Content */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }
    .workspace-header {
      height: 52px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      font-size: 0.88rem;
    }
    .session-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Feed Container */
    .viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 240px !important;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .feed {
      width: 100%;
      max-width: 860px;
      padding: 0 24px;
    }

    .turn {
      margin-bottom: 32px;
      animation: appear 0.2s ease-out;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .user-turn {
      display: flex;
      justify-content: flex-end;
    }
    .user-pill {
      background: #1e2230;
      border: 1px solid #2e3549;
      padding: 12px 18px;
      border-radius: 14px;
      max-width: 85%;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    /* Agent Reasoning Container */
    .reasoning-module {
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .reasoning-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, 0.015);
      border-bottom: 1px solid transparent;
    }
    .reasoning-header.open {
      border-bottom-color: var(--border-subtle);
    }
    .reasoning-header:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .reasoning-state {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.84rem;
      color: #a0a8ba;
    }
    .spinner-ring {
      width: 13px;
      height: 13px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .timer-badge {
      font-family: var(--font-code);
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: var(--bg-surface-elevated);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .reasoning-body {
      padding: 14px 18px;
      font-size: 0.85rem;
      color: #9299a9;
      max-height: 320px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .step-log {
      margin-bottom: 12px;
      padding-left: 10px;
      border-left: 2px solid #2d3345;
    }
    .step-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 3px;
      margin-right: 6px;
    }
    .badge-supervisor { background: #2a3142; color: #d0d7e5; }
    .badge-retriever { background: #2d1845; color: #c084fc; }
    .badge-researcher { background: #162a4a; color: #8cbcfc; }
    .badge-coder { background: #133a2a; color: #7de0a7; }
    .badge-reviewer { background: #3d2c14; color: #f5cf82; }

    /* Final Output Area */
    .artifact-body {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-primary);
    }
    .artifact-body p { margin-bottom: 12px; }
    .artifact-body ul, .artifact-body ol { margin: 0 0 14px 22px; }
    
    .code-wrapper {
      position: relative;
      margin: 14px 0;
    }
    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #1a1d29;
      border: 1px solid #363c52;
      color: #8d95a8;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-code-btn:hover {
      background: #242838;
      color: #fff;
    }
    .artifact-body pre {
      background: #08090d;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px;
      margin: 0;
      overflow-x: auto;
    }
    .artifact-body code { font-family: var(--font-code); font-size: 0.85rem; }

    /* Bottom Input Dock */
    .input-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent 0%, var(--bg-base) 40%);
      padding: 0 24px 24px;
      display: flex;
      justify-content: center;
    }
    .input-chassis {
      width: 100%;
      max-width: 860px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 12px 14px 10px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-chassis:focus-within {
      border-color: var(--accent);
      box-shadow: 0 10px 35px var(--accent-glow);
    }
    textarea#user-prompt {
      width: 100%;
      height: 40px;
      max-height: 140px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.92rem;
      resize: none;
      line-height: 1.5;
    }
    .dock-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }
    .mode-indicator {
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .run-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .run-btn:disabled {
      background: #252a38;
      color: #555e73;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-icon">M</div>
      <div class="brand-title">Agent Workspace</div>
    </div>
    
    <button class="new-session-btn" onclick="createNewSession()">
      <span>New Objective</span>
      <span style="font-size: 0.75rem; color: var(--text-secondary);">⌘N</span>
    </button>

    <!-- Chat Threads History List -->
    <div class="threads-section">
      <div class="section-heading">Recent Sessions</div>
      <div class="threads-list" id="threads-container"></div>
    </div>

    <!-- Active Agents Status with Engine Badges -->
    <div class="agent-pipeline-list">
      <div class="section-heading">Active Pipeline Nodes</div>
      
      <div class="pipeline-node" id="node-supervisor">
        <div class="node-label"><span class="status-dot"></span> Supervisor</div>
        <span class="engine-tag ollama" id="badge-supervisor">OLLAMA</span>
      </div>

      <div class="pipeline-node" id="node-retriever">
        <div class="node-label"><span class="status-dot"></span> Retriever</div>
        <span class="engine-tag chromadb" id="badge-retriever">VECTOR DB</span>
      </div>

      <div class="pipeline-node" id="node-researcher">
        <div class="node-label"><span class="status-dot"></span> Researcher</div>
        <span class="engine-tag gemini" id="badge-researcher">GEMINI API</span>
      </div>

      <div class="pipeline-node" id="node-coder">
        <div class="node-label"><span class="status-dot"></span> Coder</div>
        <span class="engine-tag ollama" id="badge-coder">OLLAMA</span>
      </div>

      <div class="pipeline-node" id="node-reviewer">
        <div class="node-label"><span class="status-dot"></span> Critic</div>
        <span class="engine-tag gemini" id="badge-reviewer">GEMINI API</span>
      </div>
    </div>

    <div class="sidebar-meta">
      <span id="footer-engine-label">Tiered CRAG</span>
      <span>v1.2</span>
    </div>
  </div>

  <!-- Workspace Arena -->
  <div class="workspace">
    <div class="workspace-header">
      <div class="session-indicator" id="header-status-indicator">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #22c55e;"></span>
        <span id="header-runtime-text">Local Runtime Active</span>
      </div>
    </div>

    <div class="viewport" id="scroll-area">
      <div class="feed" id="chat-feed"></div>
    </div>

    <!-- Floating Command Input -->
    <div class="input-dock">
      <div class="input-chassis">
        <textarea id="user-prompt" placeholder="Describe the goal or question..." rows="1" oninput="autoResize(this)" onkeydown="checkSubmit(event)"></textarea>
        <div class="dock-actions">
          <div class="mode-indicator">
            <span>Graph Iterations: Auto-Route</span>
          </div>
          <button id="submit-btn" class="run-btn" onclick="executeGraph()">
            <svg width="14" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let sessions = JSON.parse(localStorage.getItem('agent_sessions') || '{}');
    let currentThreadId = localStorage.getItem('agent_current_thread') || null;

    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      }
    });

    async function loadRuntimeConfig() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();

        // Supervisor Node
        const sBadge = document.getElementById('badge-supervisor');
        sBadge.innerText = config.nodes.supervisor.engine === 'Ollama' ? 'OLLAMA' : 'GEMINI API';
        sBadge.className = `engine-tag ${config.nodes.supervisor.engine.toLowerCase()}`;

        // Retriever Node
        const rtrvBadge = document.getElementById('badge-retriever');
        rtrvBadge.innerText = 'VECTOR DB';
        rtrvBadge.className = 'engine-tag chromadb';

        // Researcher Node
        const rBadge = document.getElementById('badge-researcher');
        rBadge.innerText = 'GEMINI API';
        rBadge.className = 'engine-tag gemini';

        // Coder Node
        const cBadge = document.getElementById('badge-coder');
        cBadge.innerText = config.nodes.coder.engine === 'Ollama' ? 'OLLAMA' : 'GEMINI API';
        cBadge.className = `engine-tag ${config.nodes.coder.engine.toLowerCase()}`;

        // Reviewer Node
        const revBadge = document.getElementById('badge-reviewer');
        revBadge.innerText = 'GEMINI API';
        revBadge.className = 'engine-tag gemini';

        // Header & Footer Labels
        const footerLabel = document.getElementById('footer-engine-label');
        footerLabel.innerText = config.use_local ? `Tiered: Ollama + Gemini` : `Cloud: Gemini API`;

        const headerRuntime = document.getElementById('header-runtime-text');
        headerRuntime.innerText = config.use_local 
          ? `Ollama (${config.ollama_model}) + ${config.gemini_model}` 
          : `Gemini (${config.gemini_model})`;
      } catch (e) {
        console.warn('Could not load /api/config', e);
      }
    }

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') {
        e.preventDefault();
        createNewSession();
      }
    });

    function saveSessions() {
      localStorage.setItem('agent_sessions', JSON.stringify(sessions));
      localStorage.setItem('agent_current_thread', currentThreadId);
    }

    function renderThreadsList() {
      const container = document.getElementById('threads-container');
      container.innerHTML = '';

      const threadKeys = Object.keys(sessions).reverse();
      if (threadKeys.length === 0) {
        container.innerHTML = `<span style="font-size: 0.78rem; color: var(--text-secondary); padding: 4px;">No past sessions</span>`;
        return;
      }

      threadKeys.forEach(id => {
        const item = document.createElement('div');
        item.className = `thread-item ${id === currentThreadId ? 'active' : ''}`;
        item.onclick = () => switchSession(id);

        item.innerHTML = `
          <span class="thread-title">${sessions[id].title || 'Untitled Session'}</span>
          <button class="thread-del-btn" onclick="deleteSession(event, '${id}')">✕</button>
        `;
        container.appendChild(item);
      });
    }

    function switchSession(threadId) {
      currentThreadId = threadId;
      saveSessions();
      renderThreadsList();
      renderFeedForThread(threadId);
    }

    function createNewSession() {
      currentThreadId = `session-${Math.random().toString(36).substring(2, 9)}`;
      sessions[currentThreadId] = {
        title: 'New Session',
        turns: []
      };
      saveSessions();
      renderThreadsList();
      renderFeedForThread(currentThreadId);
      document.getElementById('user-prompt').focus();
    }

    function deleteSession(e, threadId) {
      e.stopPropagation();
      delete sessions[threadId];
      if (currentThreadId === threadId) {
        const remaining = Object.keys(sessions);
        currentThreadId = remaining.length > 0 ? remaining[remaining.length - 1] : null;
      }
      saveSessions();
      renderThreadsList();
      if (currentThreadId) {
        renderFeedForThread(currentThreadId);
      } else {
        createNewSession();
      }
    }

    function renderFeedForThread(threadId) {
      const feed = document.getElementById('chat-feed');
      feed.innerHTML = '';
      setActiveNode('');

      const session = sessions[threadId];
      if (!session || !session.turns || session.turns.length === 0) {
        feed.innerHTML = `
          <div class="turn">
            <div class="artifact-body">
              <p style="color: var(--text-secondary);">Autonomous pipeline initialized. Formulate an objective requiring internal RAG, web research, or computed verification below.</p>
            </div>
          </div>
        `;
        return;
      }

      session.turns.forEach((turn, idx) => {
        if (turn.type === 'user') {
          feed.innerHTML += `
            <div class="turn user-turn">
              <div class="user-pill">${turn.content}</div>
            </div>
          `;
        } else if (turn.type === 'assistant') {
          const bodyId = `hist-body-${idx}`;
          const headerId = `hist-head-${idx}`;
          feed.innerHTML += `
            <div class="turn">
              <div class="reasoning-module">
                <div class="reasoning-header" id="${headerId}" onclick="toggleDropdown('${bodyId}', '${headerId}')">
                  <div class="reasoning-state">
                    <span>✓ Execution Logs</span>
                  </div>
                  <span class="timer-badge">Completed</span>
                </div>
                <div class="reasoning-body" id="${bodyId}" style="display: none;">${turn.reasoningHtml || ''}</div>
              </div>
              <div class="artifact-body">${marked.parse(turn.content || '')}</div>
            </div>
          `;
        }
      });

      enhanceCodeBlocks(feed);
      const scrollArea = document.getElementById("scroll-area");
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function setActiveNode(nodeName) {
      document.querySelectorAll('.pipeline-node').forEach(el => el.classList.remove('active'));
      if (!nodeName) return;
      
      const target = document.getElementById(`node-${nodeName.toLowerCase()}`);
      if (target) target.classList.add('active');
    }

    function enhanceCodeBlocks(container) {
      container.querySelectorAll('pre').forEach(pre => {
        if (pre.parentElement.classList.contains('code-wrapper')) return;
        
        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const btn = document.createElement('button');
        btn.className = 'copy-code-btn';
        btn.innerText = 'Copy';
        btn.onclick = () => {
          navigator.clipboard.writeText(pre.innerText);
          btn.innerText = 'Copied!';
          setTimeout(() => btn.innerText = 'Copy', 2000);
        };
        wrapper.appendChild(btn);
      });
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
    }

    function checkSubmit(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        executeGraph();
      }
    }

    async function executeGraph() {
      const input = document.getElementById("user-prompt");
      const btn = document.getElementById("submit-btn");
      const feed = document.getElementById("chat-feed");
      const scrollArea = document.getElementById("scroll-area");
      const goal = input.value.trim();

      if (!goal) return;

      if (!currentThreadId || !sessions[currentThreadId]) {
        createNewSession();
      }

      if (sessions[currentThreadId].turns.length === 0) {
        sessions[currentThreadId].title = goal.length > 25 ? goal.substring(0, 25) + '...' : goal;
        renderThreadsList();
      }

      sessions[currentThreadId].turns.push({ type: 'user', content: goal });
      saveSessions();

      feed.innerHTML += `
        <div class="turn user-turn">
          <div class="user-pill">${goal}</div>
        </div>
      `;

      input.value = "";
      input.style.height = "40px";
      btn.disabled = true;
      scrollArea.scrollTop = scrollArea.scrollHeight;

      const turnId = Date.now();
      const reasoningBoxId = `reasoning-${turnId}`;
      const headerId = `header-${turnId}`;
      const bodyId = `body-${turnId}`;
      const timerId = `timer-${turnId}`;
      const artifactId = `artifact-${turnId}`;

      feed.innerHTML += `
        <div class="turn">
          <div class="reasoning-module" id="${reasoningBoxId}">
            <div class="reasoning-header open" id="${headerId}" onclick="toggleDropdown('${bodyId}', '${headerId}')">
              <div class="reasoning-state">
                <div class="spinner-ring" id="spin-${turnId}"></div>
                <span id="label-${turnId}">Reasoning & Routing Workflow</span>
              </div>
              <span class="timer-badge" id="${timerId}">0.0s</span>
            </div>
            <div class="reasoning-body" id="${bodyId}"></div>
          </div>
          <div class="artifact-body" id="${artifactId}"></div>
        </div>
      `;

      scrollArea.scrollTop = scrollArea.scrollHeight;

      const startTime = performance.now();
      const timer = setInterval(() => {
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
        const el = document.getElementById(timerId);
        if (el) el.innerText = elapsed + "s";
      }, 100);

      const bodyEl = document.getElementById(bodyId);
      const artifactEl = document.getElementById(artifactId);

      try {
        const response = await fetch("/run-stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            user_goal: goal,
            thread_id: currentThreadId 
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const data = JSON.parse(line.replace("data: ", ""));
              
              if (data.node === "COMPLETE") {
                clearInterval(timer);
                document.getElementById(`spin-${turnId}`).style.display = "none";
                const label = document.getElementById(`label-${turnId}`);
                label.innerText = `✓ Reasoning completed in ${document.getElementById(timerId).innerText}`;
                
                const hEl = document.getElementById(headerId);
                if (hEl && hEl.classList.contains("open")) {
                  toggleDropdown(bodyId, headerId);
                }
                
                setActiveNode('');

                if (data.final_output) {
                  artifactEl.innerHTML = marked.parse(data.final_output);
                  enhanceCodeBlocks(artifactEl);

                  sessions[currentThreadId].turns.push({
                    type: 'assistant',
                    content: data.final_output,
                    reasoningHtml: bodyEl.innerHTML
                  });
                  saveSessions();
                }
                btn.disabled = false;
                scrollArea.scrollTop = scrollArea.scrollHeight;
                return;
              }

              setActiveNode(data.node || 'supervisor');
              appendStepLog(data, bodyEl);
              scrollArea.scrollTop = scrollArea.scrollHeight;
            }
          }
        }
      } catch (err) {
        clearInterval(timer);
        setActiveNode('');
        artifactEl.innerHTML = `<p style="color: #f87171;">Connection error: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    function toggleDropdown(bodyId, headerId) {
      const b = document.getElementById(bodyId);
      const h = document.getElementById(headerId);
      if (b.style.display === "none") {
        b.style.display = "block";
        h.classList.add("open");
      } else {
        b.style.display = "none";
        h.classList.remove("open");
      }
    }

    function appendStepLog(data, container) {
      if (data.node === 'INIT') return;
      const step = document.createElement("div");
      step.className = "step-log";
      const node = data.node || "supervisor";
      const engineTag = data.engine ? `<span class="engine-tag ${data.engine.toLowerCase()}">${data.engine}</span> ` : '';
      let log = `<span class="step-badge badge-${node.toLowerCase()}">${node.toUpperCase()}</span> ${engineTag}`;

      if (data.plan) log += `Planner updated graph strategy (${data.plan.length} stages).<br>`;
      if (data.next_step) log += `Transferred execution to: <code>${data.next_step}</code><br>`;
      if (data.retrieval_grade) log += `Vector DB evaluated retrieval grade: <b>${data.retrieval_grade}</b> (${data.documents ? data.documents.length : 0} chunks).<br>`;
      if (data.research_snippet) log += `Retrieved factual web findings.<br>`;
      if (data.code_output) log += `Sandbox executed calculation successfully.<br>`;
      if (data.review_feedback) log += `Critic audit: <em>${data.review_feedback}</em>`;

      step.innerHTML = log;
      container.appendChild(step);
    }

    loadRuntimeConfig();
    if (!currentThreadId || !sessions[currentThreadId]) {
      createNewSession();
    } else {
      renderThreadsList();
      renderFeedForThread(currentThreadId);
    }
  </script>
</body>
</html>
